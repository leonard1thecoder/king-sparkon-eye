name: Refresh multipart dependency lock

on:
  push:
    branches:
      - issue/124-streaming-multipart-limit
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/124-streaming-multipart-limit
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - name: Format Rust sources and resolve the selected dependency features
        run: |
          cargo fmt --all
          cargo check --all-features
      - name: Commit generated formatting and lockfile
        run: |
          if ! git diff --quiet -- Cargo.lock src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock src
            git commit -m "chore(upload): regenerate lockfile and format streaming ingress"
            git push origin HEAD:issue/124-streaming-multipart-limit
          fi
