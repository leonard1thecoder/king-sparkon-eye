name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format-and-lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eye_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      EYE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eye_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # No provider keys are configured on the runner. Provider behaviour
      # is tested against local mocks, so CI must pass without credentials.
      - name: Run tests
        run: cargo test --all-features --locked

  container-build:
    name: Container image builds (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --tag king-sparkon-eye:ci .
      - name: Run as non-root user
        run: test "$(docker run --rm --entrypoint id king-sparkon-eye:ci -u)" = "10001"

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against RustSec advisories
        run: cargo audit --deny warnings
