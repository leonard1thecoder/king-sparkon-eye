name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format-and-lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      # No provider keys are configured on the runner. Provider behaviour
      # is tested against local mocks, so CI must pass without credentials.
      - name: Run Rust tests
        run: cargo test --all-features --locked
      - name: Run Stripe catalog provisioner tests
        run: python3 tests/test_stripe_catalog_provisioning.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Cargo.lock against RustSec advisories
        run: cargo audit --deny warnings

  postgres-integration:
    name: Supabase PostgreSQL integration
    # Never expose the database secret to pull-request code, including same-repository PRs.
    # Run on trusted main pushes or an explicitly dispatched workflow on a selected branch.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EYE_TEST_DATABASE_URL: ${{ secrets.EYE_TEST_DATABASE_URL }}
      EYE_TEST_DATABASE_ALLOW_SUPABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Require the dedicated Supabase test database secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EYE_TEST_DATABASE_URL}" ]]; then
            echo "::error::EYE_TEST_DATABASE_URL is missing. Configure it as a repository Actions secret."
            exit 1
          fi
          case "${EYE_TEST_DATABASE_URL}" in
            postgres://*|postgresql://*) ;;
            *) echo "::error::EYE_TEST_DATABASE_URL must be a PostgreSQL URI"; exit 1 ;;
          esac
      - name: Install PostgreSQL client and report server version
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "${EYE_TEST_DATABASE_URL}" --no-psqlrc --tuples-only --no-align --command 'SHOW server_version'
      - name: Run auth and billing PostgreSQL integration suites
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test auth_store_test -- --nocapture
          cargo test --locked --test login_test -- --nocapture
          cargo test --locked --test registration_test -- --nocapture
          cargo test --locked --test password_reset_test -- --nocapture
          cargo test --locked --test billing_accounts_postgres -- --nocapture
          cargo test --locked --test tenant_persistence_test -- --nocapture
          cargo test --locked --test api_credential_persistence_test -- --nocapture
          cargo test --locked --test api_credentials_http_test -- --nocapture
