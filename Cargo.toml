[package]
name = "king_sparkon_eye"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["load-dynamic"] }
ring = "0.17.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.7.1", features = ["request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.0", features = ["v4"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
bcrypt = "0.19"

[dev-dependencies]
axum = "0.8"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
